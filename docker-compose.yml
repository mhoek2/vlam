version: '3.8'

services:

  app:
    image: ghcr.io/mhoek2/vlam:latest
    container_name: vlam_app
    working_dir: /var/www
    volumes:
      - ./.env:/var/www/.env:ro
      - appdata:/var/www
    depends_on:
      - db

  webserver:
    image: nginx:latest
    container_name: vlam_nginx
    ports:
      - "80:80"
    volumes:
      - appdata:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: vlam_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: vlam_db
      MYSQL_USER: vlam_user
      MYSQL_PASSWORD: vlam_pass
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
      - ./sql/vlam.sql:/docker-entrypoint-initdb.d/init.sql

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: vlam_phpmyadmin
    restart: always
    #ports:
    #  - "8080:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      # comment URI and COOKIE when using dedicated ports above
      PMA_ABSOLUTE_URI: http://localhost/phpmyadmin/
      PMA_COOKIE_SECURE: 0
    depends_on:
      - db

volumes:
  dbdata:
  appdata: